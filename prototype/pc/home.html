<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
function hydrate(root){
  root.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  root.querySelectorAll('[data-spark]').forEach(drawSpark);
}
function drawSpark(svg){
  var vals = svg.getAttribute('data-spark').split(',').map(Number);
  var w=90,h=34,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  var pts = vals.map(function(v,i){ return (i/(vals.length-1)*w).toFixed(1)+','+((h-4)-(v-min)/(max-min||1)*(h-10)).toFixed(1); }).join(' ');
  svg.innerHTML = '<polyline points="'+pts+'" fill="none" stroke="#2e6ba8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
}
shell({
  active:'home',
  crumb:'首页 / <b>业务工作台</b>',
  body:document.getElementById('pageBody').innerHTML,
  after:function(){
    hydrate(document.getElementById('content'));
    if(window.echarts){
      var c = echarts.init(document.getElementById('trendChart'));
      c.setOption({
        grid:{left:50,right:20,top:30,bottom:30},
        tooltip:{trigger:'axis'},
        xAxis:{type:'category',boundaryGap:false,data:['10月','11月','12月','1月','2月','3月','4月','5月','6月','7月','8月','9月'],axisLine:{lineStyle:{color:'#e4e7ed'}},axisLabel:{color:'#909399'}},
        yAxis:{type:'value',splitLine:{lineStyle:{color:'#f0f2f5'}},axisLabel:{color:'#909399'}},
        series:[
          {name:'销售额',type:'line',smooth:true,symbol:'circle',symbolSize:6,data:[820,910,980,860,760,940,1060,1120,1080,1180,1210,1286],
           lineStyle:{width:3,color:'#2e6ba8'},itemStyle:{color:'#2e6ba8'},
           areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(46,107,168,.22)'},{offset:1,color:'rgba(46,107,168,.01)'}]}}},
          {name:'回款额',type:'line',smooth:true,symbol:'circle',symbolSize:6,data:[760,830,900,810,720,880,980,1040,1010,1100,1150,1205],
           lineStyle:{width:2.5,color:'#52c41a'},itemStyle:{color:'#52c41a'}}
        ]
      });
      window.addEventListener('resize',function(){c.resize();});
    }
  }
});
</script>

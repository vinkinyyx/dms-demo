spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dms_test}?stringtype=unspecified
    username: ${DB_USER:dms}
    password: ${DB_PASSWORD:dms123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: Asia/Shanghai
      hibernate.format_sql: false
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

dms:
  jwt:
    secret: test-secret-key-1234567890-1234567890-1234567890
    access-token-ttl: 28800000
    refresh-token-ttl: 604800000
  seed:
    enabled: false

logging:
  level:
    root: WARN
    com.dms: INFO
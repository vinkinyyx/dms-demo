# DMS 鍚庣榛樿閰嶇疆锛坧rofile: docker锛?
server:
  port: 8080
spring:
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:vinkinyu@163.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtps
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: false
      mail.smtp.connectiontimeout: ${SMTP_CONN_TIMEOUT:5000}
      mail.smtp.timeout: ${SMTP_TIMEOUT:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT:5000}
  application:
    name: dms-backend
  profiles:
    default: docker
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dms}?stringtype=unspecified
    username: ${DB_USER:dms}
    password: ${DB_PASSWORD:dms123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: Asia/Shanghai
      hibernate.format_sql: true
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

dms:
  app:
    base-url: ${APP_BASE_URL:http://43.128.145.141}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:vinkinyu@163.com}}
    enabled: ${MAIL_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:dms-super-secret-key-please-change-in-prod-1234567890abcdef}
    # 会话有效期：access token 8 小时（28800000ms）；refresh token 7 天（604800000ms）
    access-token-ttl: ${ACCESS_TOKEN_TTL:28800000}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:604800000}
  wechat:
    app-id: ${WECHAT_APP_ID:mock_appid}
    app-secret: ${WECHAT_APP_SECRET:mock_secret}
    mock-enabled: true
  seed:
    enabled: ${SEED_ENABLED:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:dms}

logging:
  level:
    root: INFO
    com.dms: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: dms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html





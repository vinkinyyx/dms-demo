[pytest]
# 测试路径
testpaths = tests

# 文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    -p no:warnings

# 标记
markers =
    smoke: 冒烟测试（P0核心链路）
    api: API查询类测试
    crud: CRUD基础测试
    negative: 异常/负向用例（错误参数、空字段、注入）
    security: 安全测试（SQL注入/XSS/越权）
    integration: 跨模块集成测试
    e2e: 端到端全链路测试
    export: 导入导出测试
    platform: 平台后台专项测试
    mobile: 移动端H5测试
    performance: 性能测试
    slow: 耗时较长的测试
